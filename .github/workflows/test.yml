name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: python -m pip install . packaging==26.3 pytest==9.1.1 ruff==0.17.0
      - run: pytest -q
      - run: ruff check .
      - run: ruff format --check .
      - run: node --check src/upgrade_atlas/web/app.js
